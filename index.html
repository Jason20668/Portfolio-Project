<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — A Design Chronicle</title>
  <link rel="icon" type="image/png" href="imgs/Fav_Book.png">
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=EB+Garamond:ital@0;1&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app">
    <!-- COVER SCREEN -->
    <div id="cover-screen" :class="{ hidden: viewerOpen }">
      <div class="book-gallery">
        <p class="gallery-cta">CLICK A BOOK TO OPEN</p>
        <div class="books-row books-row--top">
          <div class="book-cover" v-for="book in topBooks" :key="book.id" @click="openBook(book.id)">
            <div class="cover-inner">
              <div class="cover-diamond">✦</div>
              <h1 class="cover-title">{{ book.title }}</h1>
              <div class="cover-rule"></div>
            </div>
          </div>
        </div><!-- end books-row -->

        <div class="books-row books-row--bottom">
          <div class="book-cover" v-for="book in bottomBooks" :key="book.id" @click="openBook(book.id)">
            <div class="cover-inner">
              <div class="cover-diamond">✦</div>
              <h1 class="cover-title">{{ book.title }}</h1>
              <div class="cover-rule"></div>
            </div>
          </div>
        </div><!-- end books-row -->
      </div><!-- end book-gallery -->
    </div>

    <!-- BOOK VIEWER -->
    <div id="book-viewer" :class="{ hidden: !viewerOpen }">
      <div class="viewer-topbar">
        <button class="nav-btn" @click="backToCover">← Back to Books</button>
        <div class="book-heading">
          <div id="book-title">{{ currentBookData.title }}</div>
          <div id="book-subtitle">{{ currentBookData.subtitle }}</div>
        </div>
      </div>
      <div class="book-container">
        <div id="book-spread">
          <div class="spread">
            <div :class="['page', 'page-left', currentSpread.leftClass]" v-html="currentSpread.leftHtml"></div>
            <div :class="['page', 'page-right', currentSpread.rightClass]" v-html="currentSpread.rightHtml"></div>
          </div>
        </div>
      </div>

      <div class="nav-bar">
        <button class="nav-btn" @click="prevSpread">← Previous</button>
        <div class="spread-indicator">
          <div class="dots" id="dots">
            <span v-for="n in totalSpreads" :key="n" class="dot" :class="{ active: n === current }"
              @click="goTo(n)"></span>
          </div>
          <span class="spread-label">Spread {{ current }} of {{ totalSpreads }}</span>
        </div>
        <button class="nav-btn" @click="nextSpread">Next →</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="script.js"></script>
</body>

</html>
