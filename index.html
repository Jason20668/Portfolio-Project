<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — A Design Chronicle</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

  <!-- COVER SCREEN -->
  <div id="cover-screen">
    <div class="book-gallery">
      <div class="top-row">
        <div class="book-cover top-book" data-book="book1">
          <div class="cover-inner">
            <div class="cover-diamond">✦</div>
            <h1 class="cover-title">My Portdolio</h1>
            <p class="cover-subtitle">Jason Bach</p>
            <div class="cover-rule"></div>
          </div>
        </div>
      </div>

      <div class="gallery-cta click-to-open">CLICK A BOOK TO OPEN</div>

      <div class="book-carousel">
        <button class="carousel-btn carousel-prev" type="button" aria-label="Previous books">←</button>
        <div class="book-track">
          <div class="carousel-page">
            <div class="book-cover" data-book="book2">
              <div class="cover-inner">
                <div class="cover-diamond">✦</div>
                <h1 class="cover-title">Featured Website 1</h1>
                <p class="cover-subtitle">Jason Bach</p>
                <div class="cover-rule"></div>
              </div>
            </div>
            <div class="book-cover" data-book="book3">
              <div class="cover-inner">
                <div class="cover-diamond">✦</div>
                <h1 class="cover-title">Featured Website 2</h1>
                <p class="cover-subtitle">Jason Bach</p>
                <div class="cover-rule"></div>
              </div>
            </div>
            <div class="book-cover" data-book="book4">
              <div class="cover-inner">
                <div class="cover-diamond">✦</div>
                <h1 class="cover-title">Featured Website 3</h1>
                <p class="cover-subtitle">Jason Bach</p>
                <div class="cover-rule"></div>
              </div>
            </div>
          </div>
          <div class="carousel-page">
            <div class="book-cover" data-book="book5">
              <div class="cover-inner">
                <div class="cover-diamond">✦</div>
                <h1 class="cover-title">Featured Website 4</h1>
                <p class="cover-subtitle">Jason Bach</p>
                <div class="cover-rule"></div>
              </div>
            </div>
            <div class="book-cover" data-book="book6">
              <div class="cover-inner">
                <div class="cover-diamond">✦</div>
                <h1 class="cover-title">Featured Website 5</h1>
                <p class="cover-subtitle">Jason Bach</p>
                <div class="cover-rule"></div>
              </div>
            </div>
            <div class="book-cover" data-book="book7">
              <div class="cover-inner">
                <div class="cover-diamond">✦</div>
                <h1 class="cover-title">Featured Website 6</h1>
                <p class="cover-subtitle">Jason Bach</p>
                <div class="cover-rule"></div>
              </div>
            </div>
          </div>
        </div>
        <button class="carousel-btn carousel-next" type="button" aria-label="Next books">→</button>
      </div>
    </div>
  </div>

  <!-- BOOK VIEWER -->
  <div id="book-viewer" class="hidden">
    <div class="viewer-topbar">
      <button class="nav-btn" id="back-btn">← Back to Books</button>
      <div class="book-heading">
        <div id="book-title">Jason Bach</div>
        <div id="book-subtitle">My Portfolio</div>
      </div>
    </div>
    <div class="book-container">
      <div id="book-spread"></div><!-- dynamic book content -->
    </div><!-- end book-container -->

    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn">← Previous</button>
      <div class="spread-indicator">
        <div class="dots" id="dots"></div>
        <span class="spread-label" id="spread-label">Spread 1 of 8</span>
      </div>
      <button class="nav-btn" id="next-btn">Next →</button>
    </div>
  </div>

  

  <script src="script.js"></script>
</body>
</html>
